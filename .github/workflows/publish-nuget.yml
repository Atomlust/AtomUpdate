name: Publish NuGet

# 打 tag（如 v1.0.1）触发：构建 + 测试 → 6 RID AOT 更新器 → 内嵌打包
# → 推送 nuget.org → 创建 GitHub Release（附 nupkg 与说明）→ 追加 docs/RELEASES.md 发布记录并回提 main。
# 发布鉴权：Trusted Publishing（无长期 API Key）——publish job 以 OIDC 换临时 key 推送。
# 前置配置：nuget.org 账户页 → Trusted Publishing 注册策略（Owner=Atomlust /
# Repository=AtomUpdate / Workflow File=publish-nuget.yml，Environment 留空）；
# 仓库 Secret 仅需 NUGET_USER（nuget.org 个人资料页的用户名，非邮箱）。
# 版本约束：tag 去掉 v 后必须等于 Directory.Build.props 的 <Version>，不一致直接失败。

on:
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read  # 顶级最小权限；publish job 按需提权（Release/回提 main/OIDC）

jobs:
  check-version:
    name: 校验 tag 与工程版本一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 比对 tag 与 Directory.Build.props
        run: |
          tag="${GITHUB_REF_NAME#v}"
          props="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          echo "tag=$tag props=$props"
          if [ "$tag" != "$props" ]; then
            echo "::error::tag v$tag 与 Directory.Build.props 版本 $props 不一致，请先改版本号再打 tag"
            exit 1
          fi

  updater:
    name: 构建更新器 (${{ matrix.rid }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: 安装 arm64 交叉编译工具链（linux-arm64 专属）
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Publish
        shell: bash  # Windows runner 默认 pwsh，bash 数组/条件语法需显式指定
        run: |
          args=(-p:PublishAot=true)
          # x64 runner 交叉编译 linux-arm64：ILCompiler 无条件向编译器传 --target=<triple>（clang 语法）。
          # clang 默认即为编译器，GCC 交叉探测在 Ubuntu 上可自动解析 crt/libgcc（勿传 SysRoot——
          # Ubuntu 交叉工具链的 crtbeginS.o/libgcc 在 sysroot 之外）；链接换 lld（架构无关，
          # 默认 bfd 是宿主 x64 链接器、拒收 aarch64 目标）；gcc-aarch64-linux-gnu 提供目标 libc，
          # llvm 提供 llvm-objcopy（StripSymbols 用）
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            args+=(-p:LinkerFlavor=lld)
          fi
          dotnet publish src/AtomUpdate.Updater/AtomUpdate.Updater.csproj -c Release -r ${{ matrix.rid }} "${args[@]}" -o artifacts/updater/${{ matrix.rid }}/native
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.rid }}
          path: artifacts/updater/${{ matrix.rid }}/

  build-test:
    name: 构建与测试
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore AtomUpdate.slnx
      - name: Build
        run: dotnet build AtomUpdate.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AtomUpdate.slnx -c Release --no-build

  publish:
    name: 打包并发布 AtomUpdate 到 nuget.org
    needs: [updater, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 GitHub Release、回提 docs/RELEASES.md 到 main
      id-token: write  # Trusted Publishing：向 nuget.org 出示 OIDC token 换临时 API key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: updater-win-x64
          path: artifacts/updater/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: updater-win-arm64
          path: artifacts/updater/win-arm64
      - uses: actions/download-artifact@v4
        with:
          name: updater-linux-x64
          path: artifacts/updater/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: updater-linux-arm64
          path: artifacts/updater/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: updater-osx-x64
          path: artifacts/updater/osx-x64
      - uses: actions/download-artifact@v4
        with:
          name: updater-osx-arm64
          path: artifacts/updater/osx-arm64

      - name: 归一化更新器产物目录
        run: |
          cd artifacts/updater
          for d in */; do
            rid="${d%/}"
            mkdir -p "../.staging/$rid"
            find . -path "./$rid/*" -type f -exec mv {} "../.staging/$rid/" \;
          done
          cd .. && rm -rf updater && mv .staging updater
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "updater/$rid/native"
            find "updater/$rid" -maxdepth 1 -type f -exec mv {} "updater/$rid/native/" \;
          done
          ls -R updater | head -40

      # 标准消费端不需要单独下载更新器：AtomUpdate 包内嵌 runtimes/{rid}/native/，
      # SDK 运行期由 UpdaterProvisioner 自动释放。本步骤只服务"自定义安装流程 / 缓存 / 内网离线"
      # 这类需要裸二进制的场景。必须按 RID 打包成 zip —— 6 份产物里 4 份同名
      # AtomUpdate.Updater，作为 Release 附件会互相覆盖。
      - name: 打包各 RID 更新器（供独立下载）
        run: |
          dist="$GITHUB_WORKSPACE/artifacts/updater-dist"
          mkdir -p "$dist"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            src="$GITHUB_WORKSPACE/artifacts/updater/$rid/native"
            # 精确文件名而非 AtomUpdate.Updater* 通配：通配会把 .pdb 一并打进用户下载物
            case "$rid" in win-*) name="AtomUpdate.Updater.exe";; *) name="AtomUpdate.Updater";; esac
            if [ ! -f "$src/$name" ]; then
              echo "::error::缺少更新器二进制: $src/$name"
              exit 1
            fi
            out="$dist/AtomUpdate.Updater.$rid.zip"
            rm -f "$out"
            # zip 非 runner 必备依赖，缺失时回退 python3（GitHub runner 自带）
            (cd "$src" && zip -q "$out" "$name" 2>/dev/null) || \
              (cd "$src" && python3 -m zipfile -c "$out" "$name")
            echo ">> $(basename "$out") $(stat -c%s "$out") 字节"
          done
          (cd "$dist" && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Pack（AtomUpdate + 依赖包 Core/Abstractions）
        run: |
          mkdir -p packages
          for project in AtomUpdate.Core AtomUpdate.Abstractions AtomUpdate; do
            dotnet pack "src/$project/$project.csproj" -c Release -o packages
          done
          ls -l packages

      - name: 生成 Release 说明
        run: |
          {
            echo "## AtomUpdate ${{ github.ref_name }}"
            echo ""
            prev="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)"
            if [ -n "$prev" ]; then
              echo "### 变更（相比 $prev）"
              git log --no-merges --pretty='- %s (%h)' "${prev}..${GITHUB_REF_NAME}"
            else
              echo "### 首个发布"
              git log --no-merges -20 --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo ""
            echo "### 包内容"
            echo ""
            echo "| 文件 | 大小 | SHA512 |"
            echo "| --- | --- | --- |"
            for f in packages/*.nupkg; do
              echo "| $(basename "$f") | $(numfmt --to=iec $(stat -c%s "$f")) | $(sha512sum "$f" | cut -d' ' -f1) |"
            done
            echo ""
            echo "安装：\`dotnet add package AtomUpdate --version ${GITHUB_REF_NAME#v}\`"
            echo ""
            echo "> 注意：依赖 Microsoft.Extensions.* \`11.0.0-rtm.*\`（dnceng 预发布构建，nuget.org 尚无稳定 11.0.0）。还原时需在 nuget.config 加入 dotnet11 源：\`https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json\`（.NET 11 GA 后解除）。"
            echo ""
            echo "更新器为 6 RID Native AOT 内嵌（runtimes/{rid}/native），运行期由 SDK 自动释放，**标准接入无需任何额外下载**。"
            echo ""
            echo "### 独立获取更新器二进制（可选）"
            echo ""
            echo "仅在以下场景需要：自定义安装流程 / CI 缓存 / 内网离线分发。可从本页附件按 RID 下载对应 zip，解压即得可直接执行的 \`AtomUpdate.Updater\`。"
            echo ""
            echo "| 文件 | 平台 | 大小 | SHA256 |"
            echo "| --- | --- | --- | --- |"
            for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
              f="artifacts/updater-dist/AtomUpdate.Updater.$rid.zip"
              os="${rid%%-*}"
              [ "$os" = "win" ] && label="Windows" || { [ "$os" = "osx" ] && label="macOS" || label="Linux"; }
              echo "| \`AtomUpdate.Updater.$rid.zip\` | $label | $(numfmt --to=iec $(stat -c%s "$f")) | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
            echo ""
            echo "校验：\`sha256sum -c SHA256SUMS\`（附件同目录提供）。macOS 首次执行可能需要 Gatekeeper 放行（未做公证的 AOT 二进制）。"
            echo ""
            echo "宿主若已引用 \`AtomUpdate\` 包，请勿手工放置此二进制 —— 内嵌版本与 SDK 版本严格一致，放错版本会导致释放回退与自升级错配。"
          } > release-notes.md
          cat release-notes.md

      - name: 校验 NUGET_USER Secret
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::缺少仓库 Secret NUGET_USER（nuget.org 个人资料页显示的用户名，非邮箱）。Trusted Publishing 不再使用长期 NUGET_API_KEY，同时需在 nuget.org 账户页注册 Trusted Publishing 策略（Owner/Repository/Workflow File）。"
            exit 1
          fi

      - name: NuGet 登录（OIDC → 临时 API key，1 小时有效）
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送到 nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        # 按精确文件名推送：glob（AtomUpdate.*.nupkg）会把 Core/Abstractions 一并
        # 匹配进来，多行路径传入 dotnet nuget push 即报错（v1.0.1 首发实测）
        run: |
          v="${GITHUB_REF_NAME#v}"
          for pkg in AtomUpdate.Core AtomUpdate.Abstractions AtomUpdate; do
            f="packages/${pkg}.${v}.nupkg"
            if [ ! -f "$f" ]; then
              echo "::error::包不存在: $f（Pack 步骤产物缺失？）"
              exit 1
            fi
            echo ">> push $f"
            dotnet nuget push "$f" \
              --source "$NUGET_SOURCE" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: 等待 nuget.org 索引并校验可下载
        run: |
          v="${GITHUB_REF_NAME#v}"
          url="https://api.nuget.org/v3-flatcontainer/atomupdate/$v/atomupdate.$v.nupkg"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then echo "已可下载: $url"; exit 0; fi
            echo "尝试 $i/30: HTTP $code，60s 后重试"
            sleep 60
          done
          echo "::error::nuget.org 上 30 分钟内未查到 AtomUpdate $v"
          exit 1

      - name: 创建 GitHub Release（附 nupkg 与各 RID 更新器）
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            packages/*.nupkg
            artifacts/updater-dist/*.zip
            artifacts/updater-dist/SHA256SUMS
          make_new_body: false

      - name: 追加发布记录 docs/RELEASES.md 并回提
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}  # 仓库默认分支动态取（本仓为 master，勿写死 main）
        run: |
          mkdir -p docs
          if [ ! -f docs/RELEASES.md ]; then
            printf '# AtomUpdate 发布记录\n\n> 由 Publish NuGet 工作流在每次 tag 发布后自动追加，最新在上。\n' > docs/RELEASES.md
          fi
          entry="$(mktemp)"
          {
            printf '## %s — %s\n\n' "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%d)"
            printf -- '- 提交: %s\n' "${GITHUB_SHA::7}"
            printf -- '- 发布: [GitHub Release](https://github.com/%s/releases/tag/%s) · [nuget.org](https://www.nuget.org/packages/AtomUpdate/%s)\n' \
              "${{ github.repository }}" "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME#v}"
            printf -- '- 包:\n'
            for f in packages/*.nupkg; do
              printf '  - `%s` (%s, sha512:%s)\n' "$(basename "$f")" \
                "$(numfmt --to=iec $(stat -c%s "$f"))" "$(sha512sum "$f" | cut -c1-16)"
            done
            printf -- '- 更新器内嵌 RID: win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64\n\n'
          } > "$entry"
          # 新条目插在标题块之后、历史条目之前
          head -3 docs/RELEASES.md > docs/RELEASES.md.new
          printf '\n' >> docs/RELEASES.md.new
          cat "$entry" >> docs/RELEASES.md.new
          tail -n +4 docs/RELEASES.md >> docs/RELEASES.md.new
          mv docs/RELEASES.md.new docs/RELEASES.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$DEFAULT_BRANCH" 2>/dev/null || git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"
          git add docs/RELEASES.md
          git diff --cached --quiet && { echo '无变化，跳过提交'; exit 0; }
          git commit -m "发布记录: ${GITHUB_REF_NAME}"
          git push origin "$DEFAULT_BRANCH"
